<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灰泽满＆287 共享周表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:#f5f4f0;color:#2c2c2a;padding:24px 20px 60px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:20px;font-weight:600;letter-spacing:.5px}
.sub{font-size:13px;color:#888780;margin-top:4px}
.dates{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 16px}
.dates button{border:1px solid #d3d1c7;background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;color:#444441;transition:all .15s}
.dates button:hover{border-color:#888780}
.dates button .d{font-size:11px;color:#888780;display:block;margin-top:2px}
.dates button.active{background:#2c2c2a;color:#fff;border-color:#2c2c2a}
.dates button.active .d{color:#d3d1c7}
.board{background:#fff;border:1px solid #e5e3da;border-radius:12px;overflow-x:auto}
.head-row{display:grid;grid-template-columns:56px repeat(5,1fr);border-bottom:1px solid #e5e3da;min-width:560px}
.head-row .th{padding:10px 6px;text-align:center;font-size:13px;font-weight:600}
.av{display:inline-block;text-decoration:none;line-height:0}
.av img{width:46px;height:46px;border-radius:50%;object-fit:cover;display:block;margin:0 auto;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12);transition:transform .15s}
.av:hover img{transform:scale(1.08)}
.head-row .th .nm{display:block;font-size:12px;margin-top:5px;font-weight:500;color:#2c2c2a}
.grid{position:relative;display:grid;grid-template-columns:56px repeat(5,1fr);min-width:560px}
.gridlines{position:absolute;left:56px;right:0;top:0;bottom:0;pointer-events:none;z-index:0}
.gridlines i{position:absolute;left:0;right:0;height:1px;background:#f0eee8}
.time-axis{position:relative;height:800px;border-right:1px solid #e5e3da;z-index:1}
.time-axis span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:#888780;white-space:nowrap}
.col{position:relative;height:800px;border-left:1px solid #f0eee8;z-index:1}
.blk{position:absolute;left:4px;right:4px;border-radius:8px;padding:4px 6px;display:flex;flex-direction:column;justify-content:center;line-height:1.35;overflow:hidden;cursor:pointer;transition:filter .15s}
.blk:hover{filter:brightness(.93)}
.blk .tm{font-size:11px;opacity:.8;font-weight:500}
.blk .tp{font-size:14px;font-weight:500;word-break:break-all}
.note{font-size:12px;color:#888780;margin-top:14px;line-height:1.7}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:#5f5e5a}
.legend a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#5f5e5a}
.legend img{width:26px;height:26px;border-radius:50%;object-fit:cover}
@media (max-width:640px){
  body{padding:14px 8px 40px}
  h1{font-size:17px}
  .sub{font-size:12px}
  .dates button{padding:6px 9px;font-size:12px}
  .head-row .th{font-size:11px;padding:8px 3px}
  .av img{width:36px;height:36px}
  .head-row .th .nm{font-size:11px}
  .time-axis span{font-size:10px}
  .blk .tp{font-size:12px}
  .blk .tm{font-size:10px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>灰泽满＆287 共享周表</h1>
  <div class="sub">横轴主播 · 纵轴连续时间轴（06:00 起）· 空 = 休息留空</div>
  <div class="dates" id="dates"></div>
  <div class="board" id="board"></div>
  <div class="legend" id="legend"></div>
  <div class="note">说明：色块按直播的精确开始/结束时间定位（分钟级），点击色块跳转直播间，点击头像跳转个人空间。时间标在色块内上方小字。</div>
</div>

<script>
const STREAMERS = [{"name": "灰泽满Hazel", "color": "#D3D3D3", "avatar": "photo/Hazel.jpg", "live": "https://b23.tv/0JAnyGj", "space": "https://b23.tv/3AHwUJ1", "schedule": {"MON": [], "TUE": [["16:00", "18:00", ""], ["20:00", "22:00", ""]], "WED": [["20:00", "22:00", "游戏"]], "THU": [["11:30", "13:30", ""]], "FRI": [["21:00", "23:00", ""]], "SAT": [[null, null, "待定"]], "SUN": [["21:00", "23:00", ""]]}}, {"name": "四时小路Komichi", "color": "#FF2231", "avatar": "photo/Komichi.jpg", "live": "https://b23.tv/xuFCKTc", "space": "https://b23.tv/DY8ETAE", "schedule": {"MON": [], "TUE": [], "WED": [], "THU": [], "FRI": [], "SAT": [], "SUN": []}}, {"name": "小松绿Viridis", "color": "#8EB056", "avatar": "photo/Viridis.jpg", "live": "https://b23.tv/aZNKyp3", "space": "https://b23.tv/UIq2wIL", "schedule": {"MON": [], "TUE": [["19:00", "21:00", "来唱歌吧"]], "WED": [["19:00", "21:00", "脑死杂谈"]], "THU": [["19:00", "21:00", "偶像主题歌回"]], "FRI": [["20:00", "22:00", "致命公司联动"]], "SAT": [], "SUN": [["19:00", "21:00", "行道树（2）"]]}}, {"name": "枝堇Sumire", "color": "#B4A6BF", "avatar": "photo/Sumire.jpg", "live": "https://b23.tv/QjLdUeT", "space": "https://b23.tv/ohyp2dm", "schedule": {"MON": [["18:00", "20:00", "杂谈"]], "TUE": [["09:00", "11:00", "早台读书"], ["22:00", "00:00", "电台"]], "WED": [["22:00", "00:00", "晚间歌杂"]], "THU": [["14:00", "16:00", "午睡回"]], "FRI": [["18:00", "20:00", "小游戏"]], "SAT": [["09:00", "11:00", "早台读书"]], "SUN": []}}, {"name": "羽啾chu2u", "color": "#D4DA7B", "avatar": "photo/chu2u.jpg", "live": "https://b23.tv/89Hv7Xn", "space": "https://b23.tv/EuoNF8j", "schedule": {"MON": [["14:00", "16:00", "外星杂谈"]], "TUE": [["14:00", "16:00", "外星歌杂"]], "WED": [["22:00", "00:00", "来一起过七夕"]], "THU": [["14:00", "16:00", "外星歌杂"], ["22:00", "00:00", "外星杂谈"]], "FRI": [["20:00", "22:00", "和前辈致命公司"]], "SAT": [["14:00", "16:00", "宇宙歌杂"], ["22:00", "00:00", "宇宙电台"]], "SUN": [["22:00", "00:00", "区区恐怖游戏"]]}}];

const DAY_KEYS = ["MON","TUE","WED","THU","FRI","SAT","SUN"];
const DAY_LABELS = ["周一","周二","周三","周四","周五","周六","周日"];
const HOURS = ["06:00","08:00","10:00","12:00","14:00","16:00","18:00","20:00","22:00","24:00"];

const AXIS_START = 6;
const AXIS_END = 26;
const PX_PER_HOUR = 40;
const AXIS_H = (AXIS_END - AXIS_START) * PX_PER_HOUR;

function toHours(t){
  const p = t.split(":").map(Number);
  let hh = p[0] + p[1]/60;
  if (hh < 6) hh += 24;
  return hh;
}
function textColor(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b) > 150 ? "#2c2c2a" : "#ffffff";
}
function weekDays(){
  const today = new Date();
  const day = today.getDay();
  const mon = new Date(today);
  mon.setDate(today.getDate() - ((day+6)%7));
  const arr = [];
  for(let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(mon.getDate()+i);
    arr.push({key:DAY_KEYS[i], label:DAY_LABELS[i], date:d, mmdd:(d.getMonth()+1)+"/"+d.getDate(), isToday:i===((day+6)%7)});
  }
  return arr;
}

let currentDay = null;

function renderDates(days){
  const el = document.getElementById("dates");
  el.innerHTML = "";
  days.forEach((d,i)=>{
    const b = document.createElement("button");
    b.innerHTML = d.label + '<span class="d">'+d.mmdd+'</span>';
    if(d.isToday) b.classList.add("active");
    b.onclick = ()=>{ document.querySelectorAll(".dates button").forEach(x=>x.classList.remove("active")); b.classList.add("active"); currentDay=d.key; renderBoard(); };
    el.appendChild(b);
  });
  currentDay = days.find(d=>d.isToday).key;
}
function renderLegend(){
  const el = document.getElementById("legend");
  el.innerHTML = STREAMERS.map(s=>'<a href="'+s.space+'" target="_blank"><img src="'+s.avatar+'" alt="'+s.name+'">'+s.name.replace(/[A-Z].*/,"")+"</a>").join("");
}
function renderBoard(){
  const el = document.getElementById("board");
  let html = '<div class="head-row"><div class="th"></div>';
  STREAMERS.forEach(s=>{
    html += '<div class="th"><a class="av" href="'+s.space+'" target="_blank" title="'+s.name+' 个人空间"><img src="'+s.avatar+'" alt="'+s.name+'"></a><span class="nm">'+s.name+'</span></div>';
  });
  html += '</div><div class="grid">';

  html += '<div class="gridlines">';
  HOURS.forEach(h=>{
    const top = (toHours(h) - AXIS_START) * PX_PER_HOUR;
    html += '<i style="top:'+top+'px"></i>';
  });
  html += '</div>';

  html += '<div class="time-axis">';
  HOURS.forEach(h=>{
    const top = (toHours(h) - AXIS_START) * PX_PER_HOUR;
    html += '<span style="top:'+top+'px">'+h+'</span>';
  });
  html += '</div>';

  STREAMERS.forEach(s=>{
    html += '<div class="col">';
    const slots = (s.schedule[currentDay]||[]).filter(x=>x[0]);
    slots.forEach(x=>{
      const startH = toHours(x[0]), endH = toHours(x[1]);
      const top = (startH - AXIS_START) * PX_PER_HOUR;
      const height = Math.max((endH - startH) * PX_PER_HOUR - 3, 22);
      const tc = textColor(s.color);
      html += '<div class="blk" onclick="window.open(\''+s.live+'\',\'_blank\')" title="进入 '+s.name+' 直播间" style="top:'+top+'px;height:'+height+'px;background:'+s.color+';color:'+tc+'">'
            + '<span class="tm">'+x[0]+'</span>'
            + (x[2] ? '<span class="tp">'+x[2]+'</span>' : '')
            + '</div>';
    });
    html += '</div>';
  });

  html += '</div>';
  el.innerHTML = html;
}

const days = weekDays();
renderDates(days);
renderLegend();
renderBoard();
</script>
</body>
</html>
